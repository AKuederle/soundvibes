[package]
name = "sv"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/phonon2"]
resolver = "2"

[features]
default = ["vulkan"]
test-support = []
vulkan = ["transcribe-cpp/vulkan"]

[dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false }
phonon2 = { path = "crates/phonon2" }
clap = { version = "4.5.27", features = ["derive"] }
cpal = "0.15.3"
evdev = "0.12"
udev = { version = "0.9", features = ["send"] }
ringbuf = "0.3.3"
alsa-sys = "0.3.1"
libc = "0.2"
serde = { version = "1.0.197", features = ["derive"] }
toml = "0.8.12"
chrono = "0.4.39"
hound = "3.5.1"
signal-hook = "0.3.17"
regex = "1"
serde_json = "1.0.117"
wl-clipboard-rs = "0.9"

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
transcribe-cpp-sys = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
